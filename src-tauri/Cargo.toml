[package]
name = "reconsile"
version = "0.1.0"
description = "Local grant reconciliation"
authors = ["aXount"]
edition = "2021"

[lib]
name = "reconsile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rfd = "0.15.4"
